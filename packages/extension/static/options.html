<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ezapply options</title>
    <style>
      :root { color-scheme: light dark; font: 14px system-ui, sans-serif; }
      body { margin: 16px; min-width: 360px; }
      label { display: block; margin: 10px 0 4px; font-weight: 600; }
      input { width: 100%; box-sizing: border-box; padding: 6px 8px; font: inherit; }
      button { margin-top: 12px; padding: 6px 14px; font: inherit; }
      .row { display: flex; gap: 8px; align-items: center; margin-top: 14px; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #9ca3af; flex: none; }
      .dot.connected { background: #16a34a; }
      .dot.error { background: #dc2626; }
      .muted { opacity: 0.7; font-size: 12px; margin-top: 12px; word-break: break-all; }
    </style>
  </head>
  <body>
    <form id="form">
      <label for="port">Companion port</label>
      <input id="port" type="number" min="1" max="65535" required />
      <label for="code">Pairing code</label>
      <input id="code" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" required />
      <button type="submit">Save and connect</button>
    </form>
    <div class="row"><span id="dot" class="dot"></span><span id="status">Not connected</span></div>
    <div class="muted">Run <code>ezapply pair</code> to see the code. Extension id: <span id="extid"></span></div>
    <script src="options.js"></script>
  </body>
</html>
