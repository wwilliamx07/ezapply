<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Apply: Test Engineer</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Test Engineer</h1>
<form id="application" action="/api/submit" method="post">
  <h2>About you</h2>
  <label for="first">First name *</label>
  <input id="first" name="first" autocomplete="given-name" required>
  <label for="last">Last name *</label>
  <input id="last" name="last" autocomplete="family-name" required>
  <label for="email">Email *</label>
  <input id="email" name="email" type="email" autocomplete="email" required>
  <label for="country">Country *</label>
  <select id="country" name="country" required><option value="">Select…</option></select>
  <div id="region-row" hidden>
    <label for="region">Region *</label>
    <select id="region" name="region"><option value="">Select…</option></select>
  </div>
  <label for="school">School</label>
  <input id="school" name="school" list="schools">
  <datalist id="schools"></datalist>
  <h2>Work authorisation</h2>
  <fieldset>
    <legend>Will you need sponsorship? *</legend>
    <label><input type="radio" name="sponsor" value="yes"> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label>
  </fieldset>
  <div id="sponsor-row" hidden>
    <label for="sponsor-detail">Which visa?</label>
    <textarea id="sponsor-detail" name="sponsorDetail"></textarea>
  </div>
  <label for="resume">Resume</label>
  <input id="resume" name="resume" type="file">
  <button type="submit">Submit application</button>
</form>
<script src="/app.js"></script>
</body>
</html>
